name: community-tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_sqlite, openssl, mbstring
      - run: composer install --no-interaction
      - run: vendor/bin/phpunit
